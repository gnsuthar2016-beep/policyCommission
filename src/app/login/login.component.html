<div class="auth-page">
  <div class="animated-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="auth-card" [@slideIn]>
    <div class="brand" [@fadeIn]>
      <div class="logo-container">
        <div class="logo">SR</div>
      </div>
      <div class="brand-text">
        <h1>Sign in</h1>
        <p>Access your insurance management dashboard</p>
      </div>
    </div>

    <div class="error" *ngIf="errorMessage" [@shake]>
      <span class="error-icon">⚠️</span>
      {{ errorMessage }}
    </div>

    <div class="success" *ngIf="successMessage" [@fadeIn]>
      <span class="error-icon">✅</span>
      {{ successMessage }}
    </div>

    <div class="mode-toggle" [@fadeIn]>
      <button type="button" class="mode-btn" [class.active]="selectedMode === 'admin'" (click)="switchMode('admin')">
        Admin Login
      </button>
      <button type="button" class="mode-btn" [class.active]="selectedMode === 'customer'" (click)="switchMode('customer')">
        Customer Login
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate [@fadeIn]>
      <div class="form-group">
        <label for="email">
          <span class="label-icon">📧</span>
          Email
        </label>
        <div class="input-wrapper">
          <input 
            id="email"
            type="email" 
            formControlName="email" 
            placeholder="you@example.com" 
            [disabled]="isLoading"
            class="form-input"
          />
          <div class="input-focus-effect"></div>
        </div>
        <div class="error-text" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          ✗ Enter a valid email.
        </div>
      </div>

      <div class="form-group" *ngIf="selectedMode === 'admin'">
        <label for="password">
          <span class="label-icon">🔒</span>
          Password
        </label>
        <div class="input-wrapper">
          <input 
            id="password"
            type="password" 
            formControlName="password" 
            placeholder="••••••••" 
            [disabled]="isLoading"
            class="form-input"
          />
          <div class="input-focus-effect"></div>
        </div>
        <div class="error-text" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          ✗ Password is required (min 6 chars).
        </div>
      </div>

      <div class="form-group" *ngIf="selectedMode === 'customer' && otpSent">
        <label for="otp">
          <span class="label-icon">🔐</span>
          OTP
        </label>
        <div class="input-wrapper">
          <input 
            id="otp"
            type="text" 
            formControlName="otp" 
            placeholder="Enter 6-digit OTP" 
            maxlength="6"
            [disabled]="isLoading"
            class="form-input"
          />
          <div class="input-focus-effect"></div>
        </div>
        <div class="otp-hint" *ngIf="generatedOtp">
          <span>Generated OTP:</span>
          <strong>{{ generatedOtp }}</strong>
        </div>
      </div>

      <button class="btn-primary" type="submit" [disabled]="isLoading" [class.loading]="isLoading">
        <span class="btn-text">{{ isLoading ? (selectedMode === 'customer' ? 'Processing...' : 'Signing in...') : (selectedMode === 'customer' ? (otpSent ? 'Verify OTP' : 'Send OTP') : 'Sign in') }}</span>
        <span class="btn-icon" *ngIf="!isLoading">→</span>
        <span class="btn-loader" *ngIf="isLoading"></span>
      </button>
    </form>

    <div class="links" [@fadeIn]>
      <div class="link-group" *ngIf="selectedMode === 'admin'">
        <a (click)="goTo('register')" class="link-item">Create account</a>
      </div>
      <div class="link-group" *ngIf="selectedMode === 'admin'">
        <a (click)="goTo('forgot-password')" class="link-item">Forgot password?</a>
        <span class="link-divider">•</span>
        <a (click)="goTo('change-password')" class="link-item">Change password</a>
      </div>
      <!-- <div class="link-group">
        <button type="button" class="link-item switch-link" (click)="switchMode(selectedMode === 'admin' ? 'customer' : 'admin')">
          Switch to {{ selectedMode === 'admin' ? 'Customer Login' : 'Admin Login' }}
        </button>
      </div> -->
    </div>
  </div>
</div>
